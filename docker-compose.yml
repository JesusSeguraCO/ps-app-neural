# Desarrollo local (ADR-0010 §3.1). Solo PostgreSQL 16; las apps corren con `npm run dev:*`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ps
      POSTGRES_PASSWORD: ps
      POSTGRES_DB: ps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d ps"]
      interval: 5s
      retries: 10
volumes:
  pgdata:

<!doctype html>
<!--
  Prototipo de referencia · pantalla puerta-acceso--aviso-privacidad
  Reglas duras del artefacto (NO negociables):
  - AUTOCONTENIDO: cero dependencias externas (sin CDNs, sin frameworks, sin fetch, sin JS).
    Única importación permitida: ../tokens.css. Debe renderizar en file:// indefinidamente.
  - TOKENS: todo color, fuente, spacing, radio y sombra sale de las custom properties de
    ../tokens.css. Cero valores mágicos fuera de tokens.
  - DATOS ILUSTRATIVOS ESTÁTICOS: contenido de ejemplo neutro, embebido en el HTML.
  - ESTADOS: los estados relevantes que la HU exige son VARIANTES de pantalla en archivos
    propios (puerta-acceso--estado.html), no interacciones.
  Estado de esta variante: variante — HU-187 happy y edge: la puerta enlaza el «Aviso de privacidad» bajo el porqué, con el correo ya escrito; sin casilla de aceptación ni bloqueo del envío.
  Trazabilidad: épica EP-008 · historias HU-187 (sobre la puerta de HU-090) · registrada en ../manifest.json
  Origen: v2-adaptar (Puerta de acceso del v2: dos pasos correo y código, explicación del porqué).
  Adaptado a HU-090/HU-095 (D-4 revisada): mensaje neutro idéntico para correo invitado y no
  invitado, código no válido con código nuevo en la misma pantalla, intentos agotados sin revelar
  si el correo está invitado. Composición: patrón PP:puerta v2 (lienzo plano, marca sobre la tarjeta, «por qué» en una frase)
  de _patrones.html; oficio v2 de DESIGN.md (sin cajas de relleno, sin aviso con borde lateral).
-->
<!-- Modo feature 2026-10-02: extraído en vivo de la puerta del portal (127.0.0.1:3100/e). Borrador. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puerta de acceso · correo · prototipo</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* PP:base — SIEMPRE se copia primero. Utilidades transversales. */
    .pp-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .pp-mono { font-family: var(--pp-mono); font-variant-numeric: tabular-nums; }
    .pp-meta { font-size: var(--tc-fs-caption); color: var(--tc-text-m); font-variant-numeric: tabular-nums; }

    .pp-encabezado { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--tc-sp-3) var(--tc-sp-4); margin-bottom: var(--tc-sp-6); }

    .pp-seccion__titulo { margin: 0; font-size: var(--tc-fs-body); line-height: var(--tc-lh-h3); font-weight: var(--tc-fw-semibold); letter-spacing: var(--tc-ls-heading); }
    .pp-con-lateral { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--tc-sp-8); align-items: start; }
    .pp-tarjeta { background: var(--tc-card); border: 1px solid var(--tc-border); border-radius: var(--tc-r-md); box-shadow: var(--tc-sh-1); padding: var(--tc-sp-5); }
    @media (max-width: 1100px) { .pp-con-lateral { grid-template-columns: minmax(0, 1fr); } }
    /* /PP:base */
    /* PP:botones */
    .pp-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--tc-sp-2); min-height: 40px; padding: 0 var(--tc-sp-4); border: 1px solid transparent; border-radius: var(--tc-r-md); font-family: var(--tc-font-body); font-size: var(--tc-fs-small); font-weight: var(--tc-fw-medium); line-height: var(--tc-lh-tight); text-decoration: none; white-space: nowrap; cursor: pointer; background: none; color: var(--tc-text-h); transition: background var(--tc-dur) var(--tc-ease), border-color var(--tc-dur) var(--tc-ease), color var(--tc-dur) var(--tc-ease); }
    .pp-btn--primario { background: var(--pp-teal-fill); color: var(--tc-bg-topbar); box-shadow: var(--pp-btn-shadow); }
    .pp-btn--primario:hover { background: var(--pp-teal-fill-hover); }
    .pp-btn--cta { background: var(--pp-press); color: var(--pp-press-ink); border-radius: var(--tc-r-pill); box-shadow: var(--tc-sh-1); padding: 0 var(--tc-sp-6); font-weight: var(--tc-fw-semibold); }
    .pp-btn--contorno { background: var(--tc-card); border-color: var(--tc-border-s); color: var(--tc-text-h); box-shadow: var(--tc-sh-1); }
    .pp-btn--contorno:hover { background: var(--tc-bg-subtle); }
    .pp-btn--contorno[aria-pressed="true"] { border-color: var(--tc-primary-surface-border); background: var(--tc-primary-surface); color: var(--tc-primary-ink); }
    .pp-btn--fantasma { color: var(--tc-text-b); }
    .pp-btn--fantasma:hover { background: var(--tc-bg-subtle); color: var(--tc-text-h); }
    .pp-btn--destructivo { background: var(--tc-red); color: var(--tc-card); }
    .pp-btn--destructivo:hover { background: var(--tc-danger-ink); }
    .pp-btn--sm { min-height: 32px; padding: 0 var(--tc-sp-3); }
    .pp-btn--icono { width: 40px; padding: 0; }
    .pp-btn--sm.pp-btn--icono { width: 32px; }
    .pp-btn--bloque { width: 100%; }
    .pp-btn .pp-kbd { margin-left: var(--tc-sp-1); }
    .pp-btn[disabled], .pp-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; }
    @media (max-width: 767px) { .pp-btn { min-height: 44px; } .pp-btn--icono, .pp-btn--sm.pp-btn--icono { width: 44px; } .pp-btn .pp-kbd { display: none; } }
    /* /PP:botones */
    /* PP:campos */
    .pp-form { display: grid; gap: var(--tc-sp-5); }
    .pp-campo { display: grid; gap: var(--tc-sp-2); min-width: 0; }
    .pp-label { display: block; padding: 0; font-family: var(--tc-font-body); font-size: var(--tc-fs-small); font-weight: var(--tc-fw-medium); color: var(--tc-text-h); }
    .pp-label__opcional { font-weight: var(--tc-fw-regular); color: var(--tc-text-m); }
    .pp-input { width: 100%; min-height: 40px; padding: var(--tc-sp-2) var(--tc-sp-3); border: 1px solid var(--tc-border-s); border-radius: var(--tc-r-md); background: var(--tc-card); color: var(--tc-text-h); font-family: var(--tc-font-body); font-size: var(--tc-fs-body); line-height: var(--tc-lh-tight); box-shadow: var(--tc-sh-1); transition: border-color var(--tc-dur) var(--tc-ease), box-shadow var(--tc-dur) var(--tc-ease); }
    .pp-input::placeholder { color: var(--tc-text-s); }
    .pp-input:hover { border-color: var(--tc-text-s); }
    .pp-input:focus { outline: none; border-color: var(--tc-primary); box-shadow: var(--tc-sh-focus); }
    .pp-input[aria-invalid="true"] { border-color: var(--tc-red); }
    .pp-input[readonly] { background: var(--tc-bg-subtle); box-shadow: none; }
    .pp-input--area { min-height: 104px; line-height: var(--tc-lh-body); resize: vertical; }
    .pp-ayuda { margin: 0; font-size: var(--tc-fs-caption); line-height: var(--tc-lh-h3); color: var(--tc-text-m); }
    .pp-error { display: flex; gap: var(--tc-sp-1); margin: 0; font-size: var(--tc-fs-caption); font-weight: var(--tc-fw-medium); color: var(--tc-danger-ink); }
    .pp-form--alineado { gap: 0; }
    .pp-form-fila { display: grid; grid-template-columns: 240px minmax(0, 440px); gap: var(--tc-sp-2) var(--tc-sp-8); padding: var(--tc-sp-5) 0; border-top: 1px solid var(--tc-border); }
    .pp-form-fila:first-child { border-top: 0; padding-top: 0; }
    .pp-form-fila__etiqueta { display: grid; align-content: start; gap: var(--tc-sp-1); }
    .pp-form-fila__control { display: grid; gap: var(--tc-sp-2); min-width: 0; }
    .pp-form__acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--tc-sp-2); padding-top: var(--tc-sp-5); border-top: 1px solid var(--tc-border); }
    @media (max-width: 767px) { .pp-input { min-height: 44px; font-size: var(--tc-fs-h3); } .pp-form-fila { grid-template-columns: minmax(0, 1fr); } }
    /* /PP:campos */
    /* PP:puerta */
    .pp-puerta { min-height: 100vh; display: grid; place-items: center; padding: var(--tc-sp-10) var(--tc-sp-4); background: var(--tc-bg-canvas); }
    .pp-puerta__tarjeta { width: 100%; max-width: 400px; }
    .pp-puerta__cabecera { display: flex; align-items: center; gap: var(--tc-sp-2); margin-bottom: var(--tc-sp-6); }
    .pp-puerta__cuerpo { padding: var(--tc-sp-8); background: var(--tc-card); border: 1px solid var(--tc-border); border-radius: var(--tc-r-lg); box-shadow: var(--tc-sh-2); }
    .pp-puerta__cuerpo h1 { margin: 0 0 var(--tc-sp-2); font-size: var(--tc-fs-h3); line-height: var(--tc-lh-h3); }
    .pp-puerta__cuerpo > p { font-size: var(--tc-fs-small); color: var(--tc-text-b); }
    .pp-puerta__porque { margin: var(--tc-sp-5) 0 0; font-size: var(--tc-fs-caption); line-height: var(--tc-lh-body); color: var(--tc-text-m); }
    .pp-puerta__acciones { display: flex; flex-wrap: wrap; gap: var(--tc-sp-2) var(--tc-sp-4); margin-top: var(--tc-sp-4); font-size: var(--tc-fs-small); }
    .pp-codigo { display: flex; gap: var(--tc-sp-2); min-width: 0; margin: var(--tc-sp-4) 0 0; padding: 0; border: 0; }
    .pp-codigo legend { margin-bottom: var(--tc-sp-2); }
    .pp-codigo__casilla { flex: 1 1 0; min-width: 0; max-width: 52px; height: 56px; padding: 0; text-align: center; border: 1px solid var(--tc-border-s); border-radius: var(--tc-r-md); background: var(--tc-card); color: var(--tc-text-h); font-family: var(--pp-mono); font-size: var(--tc-fs-h2); font-weight: var(--tc-fw-medium); box-shadow: var(--tc-sh-1); }
    .pp-codigo__casilla:focus { outline: none; border-color: var(--tc-primary); box-shadow: var(--tc-sh-focus); }
    .pp-codigo--error .pp-codigo__casilla { border-color: var(--tc-red); }
    @media (max-width: 767px) { .pp-puerta { padding-top: var(--tc-sp-8); place-items: start center; } .pp-puerta__cuerpo { padding: var(--tc-sp-6) var(--tc-sp-5); } .pp-codigo { gap: var(--tc-sp-1); } }
    /* /PP:puerta */

    /* Estilos propios de esta pantalla: SOLO composición/layout. Valores visuales = var(--token). */
    .pp-marca__sep { color: var(--tc-border-s); }
    .pp-marca__producto { font-size: var(--tc-fs-small); font-weight: var(--tc-fw-medium); color: var(--tc-text-m); white-space: nowrap; }
    .pp-puerta__cuerpo strong { color: var(--tc-text-h); font-weight: var(--tc-fw-semibold); overflow-wrap: anywhere; }
    .pp-puerta__acciones .pp-enlace { display: inline-flex; align-items: center; min-height: 32px; }
    .puerta-pie-global { margin: var(--tc-sp-5) 0 0; font-size: var(--tc-fs-small); color: var(--tc-text-m); text-align: start; }
    .puerta-pie-global .pp-enlace { display: inline-flex; align-items: center; min-height: 44px; }
    @media (max-width: 767px) { .pp-puerta__acciones .pp-enlace { min-height: 44px; } }
    .pp-marca__palabra { font-family: var(--tc-font-heading); font-size: var(--tc-fs-h3); font-weight: var(--tc-fw-bold); letter-spacing: var(--tc-ls-heading); color: var(--tc-text-h); }
    .pp-puerta__cuerpo > p { margin: 0; }
    .pp-puerta__cuerpo > .pp-puerta__porque { margin-top: var(--tc-sp-5); }
    .pp-puerta__cuerpo > .puerta-destino { margin-top: var(--tc-sp-2); }
    .pp-puerta__cuerpo > .puerta-pie { margin-top: var(--tc-sp-3); }
    .puerta-correo { color: var(--tc-text-h); font-weight: var(--tc-fw-medium); overflow-wrap: anywhere; }
    .puerta-campo { margin-top: var(--tc-sp-6); }
    .puerta-input { font-size: var(--tc-fs-h3); }
    .puerta-enviar { margin-top: var(--tc-sp-5); }
    .puerta-enviar .pp-btn { min-height: 44px; }
    .puerta-destino { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--tc-sp-3); font-size: var(--tc-fs-small); color: var(--tc-text-m); }
    .puerta-destino__correo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tc-text-h); font-weight: var(--tc-fw-medium); }
    .puerta-destino .pp-enlace { display: inline-flex; align-items: center; min-height: 44px; }
    .puerta-casilla--foco { border-color: var(--tc-primary); box-shadow: var(--tc-sh-focus); }
    .pp-codigo .pp-label { width: 100%; }
    .puerta-error { margin-top: var(--tc-sp-3); }
    .puerta-secundaria { margin-top: var(--tc-sp-2); }
    .puerta-pie { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 var(--tc-sp-4); font-size: var(--tc-fs-small); color: var(--tc-text-m); font-variant-numeric: tabular-nums; }
    .puerta-pie .pp-enlace { display: inline-flex; align-items: center; min-height: 44px; }
    .puerta-hora { color: var(--tc-text-h); font-weight: var(--tc-fw-medium); font-variant-numeric: tabular-nums; }
    .puerta-contacto { margin-top: var(--tc-sp-5); padding-top: var(--tc-sp-5); border-top: 1px solid var(--tc-border); font-size: var(--tc-fs-small); color: var(--tc-text-b); }
    .puerta-contacto p { margin: 0; }
    .puerta-contacto p + p { margin-top: var(--tc-sp-1); }
    .pp-btn:focus-visible, .pp-enlace:focus-visible { outline: 2px solid var(--tc-focus-ring); outline-offset: 2px; }
    .pp-codigo__casilla:focus-visible, .pp-input:focus-visible { outline: none; border-color: var(--tc-primary); box-shadow: var(--tc-sh-focus); }

    /* EP-008 · enlace al aviso de privacidad (HU-187). «Por qué» con los valores computados de la app
       (13 px, --tc-text-b, 18 px arriba): la app gana sobre la base aprobada; drift reportado. */
    .pp-puerta__cuerpo > .pp-puerta__porque { margin-top: var(--tc-sp-5); font-size: var(--tc-fs-small); color: var(--tc-text-b); }

    .puerta-aviso .pp-enlace { display: inline-flex; align-items: center; min-height: 44px; }
  </style>
</head>
<body>
  <!-- región: contenido principal · puerta de acceso del cliente (sin topbar: aún no hay sesión) -->
  <main class="pp-puerta">
    <div class="pp-puerta__tarjeta">
      <div class="pp-puerta__cabecera">
        <svg class="pp-simbolo" viewBox="0 0 32 32" aria-hidden="true"><circle class="pp-simbolo__base" cx="16" cy="16" r="14"/><path class="pp-simbolo__linea" d="M7.5 20c4-9 11 3 17-8"/><circle class="pp-simbolo__nodo" cx="7.5" cy="20" r="2.4"/><circle class="pp-simbolo__nodo" cx="24.5" cy="12" r="2.4"/></svg>
        <span class="pp-marca__palabra">trycore</span>
        <span class="pp-marca__sep" aria-hidden="true">/</span>
        <span class="pp-marca__producto">Portal de perfiles</span>
      </div>
      <form class="pp-puerta__cuerpo" action="#" aria-describedby="puerta-porque">
        <h1>Entra con tu correo</h1>
        <p>Te enviamos un código de 6 dígitos. Sin contraseña.</p>
        <div class="pp-campo puerta-campo">
          <label class="pp-label" for="puerta-correo">Correo corporativo</label>
          <input class="pp-input puerta-input" id="puerta-correo" type="email" autocomplete="email" inputmode="email" value="mariana.ospina@bancolombia.com.co" placeholder="nombre@empresa.com">
        </div>
        <div class="puerta-enviar"><button type="submit" class="pp-btn pp-btn--primario pp-btn--bloque">Enviarme el código</button></div>
        <p class="pp-puerta__porque" id="puerta-porque">Lo pedimos porque los perfiles muestran nombre y trayectoria de profesionales reales, y solo las personas invitadas a este enlace pueden verlos.</p>
        <p class="puerta-aviso"><a class="pp-enlace" href="aviso-privacidad.html">Aviso de privacidad</a></p>
      </form>
    </div>
  </main>
</body>
</html>
